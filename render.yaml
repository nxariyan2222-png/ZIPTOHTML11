services:
  - type: web
    name: matrix-mods-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "8959111543"
      - key: CHANNEL_ID
        value: "-1003636772569"
      - key: CHANNEL_LINK
        value: "https://t.me/MATRIX_TRADER777"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: matrix-mods-telegram-bot
          envVarKey: RENDER_EXTERNAL_URL
